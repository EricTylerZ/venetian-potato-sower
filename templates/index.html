<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Venetian Potato Sower</title>
    <link href="https://fonts.googleapis.com/css2?family=Century+Schoolbook&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>Venetian Potato Sower</h1>
    <form method="post" enctype="multipart/form-data" id="process-form">
        <label for="file" {% if filename != "No file chosen" %}style="display:none;"{% endif %}>Upload CSV or .txt file:</label>
        <input type="file" id="file" name="file" accept=".csv,.txt" {% if filename != "No file chosen" %}style="display:none;"{% endif %}><br>
        <input type="hidden" name="filename" value="{{ filename }}">
        <p>Current file: {{ filename }} {% if filename != "No file chosen" %}<button type="button" onclick="clearFile()">Change File</button>{% endif %}</p>
        <label for="api_key">Your Venice.ai API Key:</label>
        <input type="text" id="api_key" name="api_key" placeholder="Paste your API key here" value="{{ api_key }}" autocomplete="off" inputmode="text" autocapitalize="none"><br>
        <label for="prompt">Analysis Prompt:</label>
        <textarea id="prompt" name="prompt" rows="4" cols="50" placeholder="e.g., Parse this file and list every sentence that discusses potatoes or venice.ai...">{{ prompt if prompt else request.form.get('prompt', '') }}</textarea><br>
        <label for="model">Select Model:</label>
        <select id="model" name="model">
            {% for model in models %}
            <option value="{{ model }}" {% if model == default_model %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
        </select><br>
        <label for="max_output_tokens">Max Output Tokens (per chunk):</label>
        <input type="number" id="max_output_tokens" name="max_output_tokens" value="{{ max_output_tokens if max_output_tokens else 3337 }}" min="100" max="{{ max_context_tokens if max_context_tokens else 131072 }}"><br>
        <button type="submit" formaction="/estimate" name="action" value="estimate">Estimate Cost</button>
        <button type="submit" formaction="/process" name="action" value="process" onclick="startProcessing(event)">Process</button>
        <button type="button" onclick="stopProcessing()" id="stop-button" style="display:none;">Stop</button>
        {% if estimate %}
        <p>{{ estimate }}</p>
        {% endif %}
        <pre id="log"></pre>
        <a href="/download" id="download-link" style="display:none;">Download Result</a>
    </form>
    <script>
        function startProcessing(event) {
            event.preventDefault();
            const form = document.getElementById('process-form');
            const log = document.getElementById('log');
            const downloadLink = document.getElementById('download-link');
            const stopButton = document.getElementById('stop-button');
            const apiKey = document.getElementById('api_key').value;
            sessionStorage.setItem('veniceApiKey', apiKey);
            log.textContent = "Processing started...\n";
            downloadLink.style.display = 'none';
            stopButton.style.display = 'inline';
            fetch('/process', {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'X-API-Key': apiKey
                }
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                function read() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            downloadLink.style.display = 'inline';
                            stopButton.style.display = 'none';
                            return;
                        }
                        log.textContent += decoder.decode(value, { stream: true });
                        log.scrollTop = log.scrollHeight;
                        read();
                    }).catch(err => {
                        log.textContent += `Error: ${err}\n`;
                        stopButton.style.display = 'none';
                    });
                }
                read();
            }).catch(err => {
                log.textContent += `Fetch Error: ${err}\n`;
                stopButton.style.display = 'none';
            });
        }
        function stopProcessing() {
            fetch('/stop', { method: 'POST' })
                .then(response => response.text())
                .then(text => console.log(text))
                .catch(err => console.error('Stop Error:', err));
        }
        function clearFile() {
            document.getElementById('file').style.display = 'inline';
            document.getElementById('file').value = '';
            document.querySelector('label[for="file"]').style.display = 'inline';
            document.querySelector('button[onclick="clearFile()"]').style.display = 'none';
        }
        document.getElementById('api_key').value = sessionStorage.getItem('veniceApiKey') || '{{ api_key }}';
    </script>
</body>
</html>
