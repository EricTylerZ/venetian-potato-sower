<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Venetian Potatoes Sower</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Venetian Potatoes Sower</h1>
    <form id="upload-form" method="post" enctype="multipart/form-data" action="/process">
        <label for="file">Upload CSV or .txt file:</label>
        <input type="file" id="file" name="file" accept=".csv,.txt"><br>
        <label for="prompt">Analysis Prompt:</label>
        <textarea id="prompt" name="prompt" rows="4" cols="50" placeholder="e.g., Parse this chat log into an abridged prompt history..."></textarea><br>
        <label for="model">Select Model:</label>
        <select id="model" name="model">
            {% for model in models %}
            <option value="{{ model }}">{{ model }}</option>
            {% endfor %}
        </select><br>
        <button type="button" onclick="estimateCost()">Estimate Cost</button>
        <p id="estimate"></p>
        <button type="submit" id="confirm" style="display:none;">Confirm and Process</button>
    </form>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
